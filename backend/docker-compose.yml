services:
  postgres:
    image: postgres:16-alpine
    container_name: rimba_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rimba
      POSTGRES_PASSWORD: rimba_secret
      POSTGRES_DB: rimba_db
    ports:
      - "5432:5432"
    volumes:
      - rimba_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rimba -d rimba_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      # Context is the repo root so the image can bundle db/migrations + db/seed.
      context: ..
      dockerfile: backend/Dockerfile
    container_name: rimba_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rimba:rimba_secret@postgres:5432/rimba_db
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3000}
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  rimba_postgres_data:
