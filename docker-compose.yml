name: rimba

services:
  postgres:
    image: postgres:16-alpine
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_USER: rimba
      POSTGRES_PASSWORD: rimba_secret
      POSTGRES_DB: rimba_db
    ports:
      - "5433:5432"
    volumes:
      - rimba_digital_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rimba -d rimba_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 1536MB Redis cache for the digital app: better-auth sessions (frontend
  # secondaryStorage) + backend check-in read caching. Host port 6380 so the
  # frontend dev server on the host can reach it (6379 left free).
  digital-redis:
    image: redis:7-alpine
    container_name: rimba-digital-redis
    restart: unless-stopped
    command: redis-server --maxmemory 1536mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./digital/backend
    container_name: rimba-digital-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      digital-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rimba:rimba_secret@postgres:5432/rimba_db
      REDIS_URL: redis://digital-redis:6379
      JWKS_URL: http://host.docker.internal:3000/api/auth/jwks
      CHECKIN_SESSION_KEY: rimba-checkin-dev-secret-change-in-prod
      ALLOWED_ORIGIN: http://localhost:3000
      S3_API: https://bbfe2e9f8f01720f3ec3d64b880d77b8.r2.cloudflarestorage.com/rimba
      PORT: "8080"
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dedicated 256MB Redis cache for the fisik catalog (static, read-heavy data).
  # No host port: only fisik-backend talks to it. allkeys-lru self-trims at the
  # cap instead of erroring if it ever fills.
  fisik-redis:
    image: redis:7-alpine
    container_name: rimba-fisik-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Physical catalog backend. Shares the single postgres above (rimba_db) —
  # its entrypoint runs goose up (catalog migration 00006) + seeds, then serves.
  # Build context is ./fisik so the image can bundle db/migrations + db/seed.
  fisik-backend:
    build:
      context: ./fisik
      dockerfile: backend/Dockerfile
    container_name: rimba-fisik-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      fisik-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rimba:rimba_secret@postgres:5432/rimba_db
      REDIS_URL: redis://fisik-redis:6379
      ALLOWED_ORIGIN: http://localhost:3000
      PORT: "8080"
    # Host 8081 (digital backend already owns 8080); container stays on 8080.
    ports:
      - "8081:8080"

volumes:
  rimba_digital_data:
