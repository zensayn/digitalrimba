name: rimba-fisik

services:
  fisik-postgres:
    image: postgres:16-alpine
    container_name: rimba-fisik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rimba
      # ponytail: dev default; export POSTGRES_PASSWORD to override anywhere
      # real. Keep it URL-safe (no @ / # ? :) — it's spliced raw into
      # DATABASE_URL below.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rimba_secret}
      POSTGRES_DB: rimba_fisik_db
    # 5434 on the host (loopback only): 5433 belongs to digital's postgres.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - fisik_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rimba -d rimba_fisik_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dedicated 256MB Redis cache for the catalog (static, read-heavy data).
  # No host port: only fisik-backend talks to it. allkeys-lru self-trims at the
  # cap instead of erroring if it ever fills.
  fisik-redis:
    image: redis:7-alpine
    container_name: rimba-fisik-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Entrypoint runs goose up + seed-catalog + seed-pricing on every start, so a
  # fresh database self-populates. Build context is fisik/ so the image can
  # bundle db/migrations + db/seed.
  fisik-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rimba-fisik-backend
    restart: unless-stopped
    depends_on:
      fisik-postgres:
        condition: service_healthy
      fisik-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rimba:${POSTGRES_PASSWORD:-rimba_secret}@fisik-postgres:5432/rimba_fisik_db
      REDIS_URL: redis://fisik-redis:6379
      ALLOWED_ORIGIN: http://localhost:3000
      PORT: "8080"
    # Host 8081 (digital backend owns 8090 → its 8080); container stays on 8080.
    ports:
      - "8081:8080"

volumes:
  fisik_data:
